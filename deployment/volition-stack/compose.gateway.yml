name: volition-stack
services:
  gateway:
    image: volition/gateway:2026-09-22-v8-project-tools
    build: ./gateway
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.5
    volumes:
      - ./config/gateway.json:/config/gateway.json:ro
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
