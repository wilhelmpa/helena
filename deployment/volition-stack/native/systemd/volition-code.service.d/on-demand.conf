[Unit]
StopWhenUnneeded=yes

[Service]
ExecStart=
ExecStart=/usr/local/bin/code-server --bind-addr 127.0.0.1:18443 --auth none --disable-telemetry --disable-update-check /srv/volition/workspaces/projects
ExecStartPost=+/usr/bin/curl --fail --silent --output /dev/null --retry 30 --retry-connrefused --retry-delay 1 --max-time 2 http://127.0.0.1:18443/healthz
TimeoutStartSec=45s
