# Owner terminal reverse proxy. Installed by setup.sh at
# /etc/nginx/snippets/volition-owner-terminal.conf; the orchestrator adds one line
# to the server block of /etc/nginx/sites-available/volition.conf (and its -dev
# counterpart) to pull it in, next to the existing tool includes:
#
#   include /etc/nginx/snippets/volition-owner-terminal.conf;
#
# Same $volition_origin_ok / auth_request pattern as the other embedded tools
# (see /etc/nginx/sites-available/volition.conf's /hermes/ and
# deployment/volition-stack/native/terminal/... for the project terminal), with
# two differences that matter for the security model in
# docs/volition-design-owner-terminals.md:
#
#  - The auth_request target is per-kind (GET /auth/verify/owner-terminal/<kind>
#    in apps/api/src/app.ts), not the generic /auth/verify/owner: it also checks
#    the owner's 12h terminal grant, and on success returns a freshly minted,
#    60-second signed token in X-Owner-Terminal-Token, which auth_request_set
#    below relays to the upstream. <kind> comes from the location's own regex
#    capture (a fixed, nginx-authored list), never from a header or cookie a
#    client controls.
#  - proxy_pass targets a Unix socket, not a loopback TCP port: the owner
#    terminal service listens on one on purpose (see
#    owner-terminal-router.mjs's header comment), and a misconfigured proxy_pass
#    here is the one thing standing between "nginx checked the grant" and
#    "nothing else did" -- keep it pointed at that socket, not a port.

# wetty links its web manifest without credentials, so the auth check below answered it
# with 401, a console error in every terminal. The manifest says nothing about a session;
# nginx answers it itself.
location ~ ^/focus/owner-terminal/.+/client/manifest\.json$ {
    default_type application/manifest+json;
    add_header Cache-Control "no-store" always;
    return 200 '{"name":"Helena Terminal","short_name":"Terminal","display":"standalone"}';
}

location ~ ^/focus/owner-terminal/(shell|claude|codex|helena-dev-claude|helena-dev-codex|local-qwen36|local-qwen38|local-flash)/ {
    if ($volition_origin_ok = 0) { return 403; }
    set $owner_terminal_kind $1;
    auth_request /_owner_terminal_auth;
    auth_request_set $owner_terminal_token $upstream_http_x_owner_terminal_token;
    proxy_set_header X-Owner-Terminal-Token $owner_terminal_token;
    include /etc/nginx/snippets/volition-tool-proxy-security.conf;
    proxy_pass http://unix:/run/volition-owner-terminal/term.sock:;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $helena_client_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location = /_owner_terminal_auth {
    internal;
    proxy_pass http://127.0.0.1:3000/auth/verify/owner-terminal/$owner_terminal_kind;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    # The api decides from this whether the LAN may skip the TOTP step-up
    # (Administrator -> Sicherheit). This location has its own proxy_set_header
    # lines, so the server-level ones are not inherited: without these two, a
    # client-sent X-Real-IP would reach the api unchanged.
    proxy_set_header X-Real-IP $helena_client_addr;
    proxy_set_header X-Forwarded-For $helena_client_addr;
}

# Native Codex calls the loopback API directly. Neither public API prefix exposes
# its bootstrap or inference capabilities through the browser reverse proxy.
location ~ ^/(backend/|api/)?owner-terminal/local/ {
    return 404;
}
