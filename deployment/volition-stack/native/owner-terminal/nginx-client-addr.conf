# The client address Helena sees (X-Real-IP). Requests on the kiosk's own port 8088 come
# from this machine's screens; nftables lets only the kiosk user reach that port
# (/etc/nftables.d/helena-kiosk.nft). They count as the home LAN, so the owner terminal
# needs no code there. Loopback on port 80 (the future Cloudflare tunnel) stays loopback.
map "$server_port" $helena_client_addr {
    default $remote_addr;
    8088    "192.168.2.220";
}
