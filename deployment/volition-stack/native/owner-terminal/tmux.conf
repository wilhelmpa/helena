# tmux as the owner terminal runs it (owner-terminal-shell passes this file). Same
# settings as deployment/volition-stack/native/terminal/tmux.conf, kept as its own
# copy because the two services are unrelated processes and the status line names
# owner sessions differently.

# Scroll and select with the mouse; hold Shift for the browser's own text selection.
set -g mouse on
set -g history-limit 50000
# The browser terminal answers tmux's queries over a websocket; an answer later than
# escape-time reaches the shell as typed text.
set -g escape-time 50
set -g default-terminal "tmux-256color"

# Several browser tabs can show the same terminal. It takes the size of the one used last
# instead of shrinking every view to the smallest.
set -g window-size latest
setw -g aggressive-resize on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g status-position top
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[fg=colour208,bold] #{s/owner-//:session_name} #[default]"
set -g status-left-length 24
set -g status-right "#{?#{e|>:#{client_width},99},Ctrl-b c new tab · Ctrl-b n/p switch ,}"
set -g status-right-length 48
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=colour255,bold] #I #W "
