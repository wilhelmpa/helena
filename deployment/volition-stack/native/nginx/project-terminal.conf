# wetty links its web manifest without credentials, so the auth check below answered it
# with 401, a console error in every terminal. The manifest says nothing about a session;
# nginx answers it itself.
location ~ ^/focus/terminal-project/.+/client/manifest\.json$ {
    default_type application/manifest+json;
    add_header Cache-Control "no-store" always;
    return 200 '{"name":"Helena Terminal","short_name":"Terminal","display":"standalone"}';
}

location = /focus/terminal-project {
    if ($volition_origin_ok = 0) { return 403; }
    auth_request /_plan_auth;
    include /etc/nginx/snippets/volition-tool-proxy-security.conf;
    proxy_pass http://127.0.0.1:8444;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location /focus/terminal-project/ {
    if ($volition_origin_ok = 0) { return 403; }
    auth_request /_plan_auth;
    include /etc/nginx/snippets/volition-tool-proxy-security.conf;
    proxy_pass http://127.0.0.1:8444;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
