# Mastra Studio for the instance owner, included in the server block of the Plan site.
# The proxy on :4111 serves Studio only to requests that carry the gateway token, and
# only this server adds it: $volition_mastra_gateway_token is defined in the root-only
# /etc/nginx/conf.d/volition-mastra-gateway.conf.
location = /_plan_auth_owner {
    internal;
    proxy_pass http://127.0.0.1:3000/auth/verify/owner;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location = /mastra {
    return 301 /mastra/;
}

location /mastra/ {
    if ($volition_origin_ok = 0) { return 403; }
    auth_request /_plan_auth_owner;
    include /etc/nginx/snippets/volition-tool-proxy-security.conf;
    proxy_set_header X-Volition-Gateway-Token $volition_mastra_gateway_token;
    proxy_pass http://127.0.0.1:4111;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
    proxy_buffering off;
}
