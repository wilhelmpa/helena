# Helena local AI (native/local-ai/install.sh): Lemonade Server as an optional host service.
# Loopback only, with the key, pinned backends and models, no downloads of its own, and a
# memory ceiling that fits the ~31 GB the OS sees (model weights live in the 96 GiB VRAM
# carve-out; NPU models take system RAM).
[Unit]
Description=Lemonade Server (Helena local AI)
After=network.target

[Service]
ExecStart=
ExecStart=/usr/local/lib/helena-ai/lemond-start
LoadCredential=api-key:/etc/helena/local-ai.key
Environment=LEMONADE_DEFAULTS_PATH=/usr/local/lib/helena-ai/lemonade-defaults.json
Environment=HF_HUB_CACHE=/var/lib/helena-ai/models/hub
Environment=HF_HUB_OFFLINE=1
SupplementaryGroups=render video
# ROCm (llama.cpp's HIP build for gfx1151, install.sh). Only what is needed, nothing that hides
# a problem: no HSA_OVERRIDE_GFX_VERSION (gfx1151 is native in ROCm 10), no
# HSA_ENABLE_SDMA/HIP_VISIBLE_DEVICES (one GPU, copies work), no unified-memory switch (the
# weights live in the fixed 96 GiB carve-out, which KFD offers on kernel 7.x).
# rocBLAS hands its GEMMs to hipBLASLt, AMD's tuned kernels: no difference on quantized models
# (llama.cpp's own MMQ kernels do those), faster on the F16/BF16 products (vision projector,
# embeddings). Measured in the decision, §4.3; bench.sh speed compares both per model.
Environment=ROCBLAS_USE_HIPBLASLT=1
# FastFlowLM pins its buffers.
LimitMEMLOCK=infinity
MemoryHigh=10G
MemoryMax=12G
TasksMax=512
CPUWeight=50
IOWeight=50
Nice=5
ProtectSystem=strict
ReadWritePaths=/var/lib/helena-ai/models
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
# Only the loopback: no downloads (offline, no_fetch_executables), no LAN.
IPAddressDeny=any
IPAddressAllow=localhost
