# Helena Notizen: how nginx hands a request to SilverBullet (notes/install.sh installs this as
# /etc/nginx/snippets/helena-notes-proxy.conf; every location of helena-notes-common.conf
# includes it). SilverBullet gets no credential of any kind: the owner's Helena cookie, an
# Authorization or API key header and Cloudflare's assertion all stop here, and it may not
# set a cookie (a cookie set on the home name would reach Helena's own port too).
proxy_pass http://unix:/run/helena-notes/notes.sock:;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection "";
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header X-Api-Key "";
proxy_set_header Cf-Access-Jwt-Assertion "";
proxy_set_header Cf-Access-Authenticated-User-Email "";
proxy_hide_header Set-Cookie;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
# /.events is a stream of changes (server-sent events): unbuffered and long-lived.
proxy_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
