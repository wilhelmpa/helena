# tmux as the project terminal in Plan runs it (terminal-shell passes this file).

# Scroll and select with the mouse; hold Shift for the browser's own text selection.
set -g mouse on
# A marking made with the mouse goes to the browser's clipboard: tmux hands it over as
# OSC 52, which Helena's terminal frame copies (apps/web/src/features/owner-terminal/
# utils/terminalClipboard.ts).
set -g set-clipboard on
set -g history-limit 50000
# The browser terminal answers tmux's queries over a websocket; an answer later than
# escape-time reaches the shell as typed text.
set -g escape-time 50
set -g default-terminal "tmux-256color"

# Several browser tabs can show the same terminal. It takes the size of the one used last
# instead of shrinking every view to the smallest.
set -g window-size latest
setw -g aggressive-resize on

# Windows are the terminal's tabs: listed along the top, numbered from 1, opened in the
# directory of the pane they were opened from.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g status-position top
set -g status-style "bg=default,fg=colour8"
set -g status-left "#[fg=colour5,bold] #{s/volition-//:session_name} #[default]"
set -g status-left-length 24
# The hint only fits beside the tab list in a wide panel.
set -g status-right "#{?#{e|>:#{client_width},99},Ctrl-b c new tab · Ctrl-b n/p switch ,}"
set -g status-right-length 48
setw -g window-status-format "#[fg=colour8] #I #W #[default]"
setw -g window-status-current-format "#[fg=colour5,bold] #I #W #[default]"
