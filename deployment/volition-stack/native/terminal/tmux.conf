# tmux as the project terminal in Plan runs it (terminal-shell passes this file).

# Scroll and select with the mouse; hold Shift for the browser's own text selection.
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g default-terminal "tmux-256color"

# Several browser tabs can show the same terminal. It takes the size of the one used last
# instead of shrinking every view to the smallest.
set -g window-size latest
setw -g aggressive-resize on

# Windows are the terminal's tabs: listed along the top, numbered from 1, opened in the
# directory of the pane they were opened from.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g status-position top
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[fg=colour39,bold] #{s/volition-//:session_name} #[default]"
set -g status-left-length 24
set -g status-right "Ctrl-b c new tab · Ctrl-b n/p switch "
set -g status-right-length 48
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=colour255,bold] #I #W "
