# DKMS package of the Sixunited AXB35-02 EC driver (cmetz/ec-su_axb35-linux), written by
# Helena's fan-control installer. The project's Makefile builds against KERNEL_BUILD.
PACKAGE_NAME="ec_su_axb35"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="ec_su_axb35"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KERNEL_BUILD=${kernel_source_dir} modules"
CLEAN="make KERNEL_BUILD=${kernel_source_dir} clean"
AUTOINSTALL="yes"
