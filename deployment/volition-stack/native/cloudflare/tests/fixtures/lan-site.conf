# Test fixture: the LAN site of Kingston (/etc/nginx/sites-available/volition.conf) as it was
# on 2026-09-25, before lan_https.py. No secret in it (the owner capability is a variable).
map $http_origin $volition_origin_ok {
    default 0;
    "" 1;
    "http://kingston-server.local" 1;
    "http://kingston-server" 1;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 127.0.0.1:8088;
    server_name kingston-server.local kingston-server;

    client_max_body_size 100m;


    location = /_plan_auth {
        internal;
        proxy_pass http://127.0.0.1:3000/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }


    location = /browser {
        return 301 /browser/;
    }

    location /browser/ {
        if ($volition_origin_ok = 0) { return 403; }
        auth_request /_plan_auth;
        include /etc/nginx/snippets/volition-tool-proxy-security.conf;
        proxy_pass http://127.0.0.1:6082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /browser;
        proxy_set_header X-Real-IP $helena_client_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /code {
        return 301 /code/;
    }

    location /code/ {
        if ($volition_origin_ok = 0) { return 403; }
        auth_request /_plan_auth;
        include /etc/nginx/snippets/volition-tool-proxy-security.conf;
        proxy_pass http://127.0.0.1:8443/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /code;
        proxy_set_header X-Real-IP $helena_client_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    include /etc/nginx/snippets/volition-project-terminal.conf;
    include /etc/nginx/snippets/volition-owner-terminal.conf;

    location = /terminal {
        if ($volition_origin_ok = 0) { return 403; }
        auth_request /_plan_auth;
        include /etc/nginx/snippets/volition-tool-proxy-security.conf;
        proxy_pass http://127.0.0.1:8444/terminal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /terminal;
        proxy_set_header X-Real-IP $helena_client_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://kingston-server.local ws://kingston-server" always;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /terminal/ {
        if ($volition_origin_ok = 0) { return 403; }
        auth_request /_plan_auth;
        include /etc/nginx/snippets/volition-tool-proxy-security.conf;
        proxy_pass http://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /terminal;
        proxy_set_header X-Real-IP $helena_client_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://kingston-server.local ws://kingston-server" always;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /backend/ {
        proxy_set_header X-Volition-Local-Access "";
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $helena_client_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location / {
        proxy_set_header X-Volition-Local-Access $helena_owner_capability;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $helena_client_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
