# Helena tunnel (helena-cloudflared.service): public resolvers only for cloudflared, which
# may not reach the home network (the router's resolver). Bound over /etc/resolv.conf in the
# unit's own mount namespace.
nameserver 1.1.1.1
nameserver 1.0.0.1
nameserver 2606:4700:4700::1111
options edns0 trust-ad
