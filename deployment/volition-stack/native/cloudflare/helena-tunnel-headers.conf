# Helena tunnel entry: the headers of every proxied request, in every location of
# helena-tunnel.conf (nginx does not inherit proxy_set_header into a location that sets
# one of its own, so each location includes this file; audit.sh counts the includes).
#
# X-Helena-Entry tells the API the request came through the internet tunnel: it then
# demands Cloudflare Access's signed assertion (Cf-Access-Jwt-Assertion, passed through
# unchanged) and never treats the client as the LAN. The LAN owner capability is blanked.
# X-Helena-Edge-Entry is the entry's proof (conf.d/helena-edge-entry.conf, a secret;
# install.sh entry-token): with it, and only with it, the web app may turn a valid Access
# assertion into a Helena session (Cloudflare sign-in, when on). The map gives it only to
# requests of this entry that go to the web app; every other upstream (the api, the tools,
# the terminals) gets none, and a client-sent header of that name is dropped everywhere.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Helena-Entry tunnel;
proxy_set_header X-Real-IP $helena_tunnel_client;
proxy_set_header X-Forwarded-For $helena_tunnel_client;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Volition-Local-Access "";
proxy_set_header X-Volition-Agent-Project "";
proxy_set_header X-Volition-Agent-Unit "";
proxy_set_header X-Volition-Agent-Runtime "";
proxy_set_header X-Helena-Edge-Entry $helena_edge_entry_token;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
