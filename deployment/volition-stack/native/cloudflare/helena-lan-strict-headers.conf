# Included in every strict LAN proxy location. The web-only entry proof is empty for
# every other upstream; the map is volatile because auth subrequests share variables.
proxy_http_version 1.1;
proxy_set_header Host helena.volition.one;
proxy_set_header X-Helena-Entry lan;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host helena.volition.one;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Forwarded-Prefix $helena_lan_prefix;
proxy_set_header X-Forwarded-Scheme "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header X-Original-URI "";
proxy_set_header X-Rewrite-URL "";
proxy_set_header Forwarded "";
proxy_set_header Cf-Connecting-IP "";
proxy_set_header Cf-Access-Authenticated-User-Email "";
proxy_set_header Cf-Access-Authenticated-User-Id "";
proxy_set_header Cf-Access-Client-Id "";
proxy_set_header Cf-Access-Client-Secret "";
proxy_set_header CF-Ray "";
proxy_set_header CF-IPCountry "";
proxy_set_header True-Client-IP "";
proxy_set_header X-Forwarded-User "";
proxy_set_header X-Forwarded-Email "";
proxy_set_header X-Helena-Edge-Email "";
proxy_set_header X-Forwarded-Client-Cert "";
proxy_set_header X-Volition-Agent-Project "";
proxy_set_header X-Volition-Agent-Unit "";
proxy_set_header X-Volition-Local-Access "";
proxy_set_header X-Helena-Edge-Entry $helena_edge_entry_token;
proxy_set_header Cf-Access-Jwt-Assertion $helena_lan_assertion;
proxy_set_header X-Owner-Terminal-Token $owner_terminal_token;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
