# Helena: the guard in front of the LAN owner sign-in (apply.sh, step "local-owner";
# docs/helena-decisions/security-hardening.md finding H-01). No secret in this file: it only
# decides WHEN the capability that volition-local-owner.conf holds is passed on.
#
# The site passes $helena_owner_capability instead of $volition_local_owner_token. It is the
# capability only when
#   - the request reached nginx on a LAN-facing address (never 127.0.0.1 or ::1: the
#     Cloudflare tunnel and every local process arrive there), and
#   - it did not come from a link-local address (a local process can bind the machine's
#     own fe80:: address and connect to its global one),
# or when it came to the kiosk's own listener, which nftables opens to the kiosk user alone.
map $server_addr $helena_lan_listener {
    default          1;
    ~^127\.          0;
    ::1              0;
    ~^::ffff:127\.   0;
}
map $remote_addr $helena_remote_linklocal {
    default          0;
    ~^fe80:          1;
    ~^169\.254\.     1;
}
map "$server_port:$helena_lan_listener$helena_remote_linklocal" $helena_owner_capability {
    default          "";
    "80:10"          $volition_local_owner_token;
    "443:10"         $volition_local_owner_token;
    "~^8088:"        $volition_local_owner_token;
}
