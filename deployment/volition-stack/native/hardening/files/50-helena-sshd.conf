# Helena SSH hardening (deployment/volition-stack/native/hardening/apply.sh, step "sshd").
# Keys only, the owner's account only. Which networks may connect at all is the firewall's
# job (the home network only). Debian reads sshd_config.d first; the first value wins.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no
AllowUsers @SSH_USERS@
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
AllowAgentForwarding no
AllowTcpForwarding local
AllowStreamLocalForwarding no
GatewayPorts no
X11Forwarding no
PermitTunnel no
PermitUserEnvironment no
