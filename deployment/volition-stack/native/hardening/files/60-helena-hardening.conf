# Helena service sandboxing (deployment/volition-stack/native/hardening/apply.sh, step "units").
# Adds to what the unit already sets (NoNewPrivileges, ProtectSystem=strict, PrivateTmp,
# ProtectHome, RestrictAddressFamilies). Nothing here changes what the service may read or
# write; it takes away kernel and privilege surface the services never use.
[Service]
CapabilityBoundingSet=
AmbientCapabilities=
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
RemoveIPC=yes
KeyringMode=private
SystemCallArchitectures=native
SystemCallFilter=~@clock @cpu-emulation @debug @module @mount @obsolete @raw-io @reboot @swap
