# Isolated Plan development instance. It listens only on a unix socket inside a
# directory that root and the developer group alone can traverse, so agent users on
# Kingston cannot reach the automatic owner sign-in. See README.md.
server {
    listen unix:/srv/volition/dev-run/plan-dev.sock;
    server_name localhost;

    client_max_body_size 100m;

    location /backend/ {
        proxy_set_header X-Volition-Local-Access "";
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location / {
        proxy_set_header X-Volition-Local-Access $volition_dev_owner_token;
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
