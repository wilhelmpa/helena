# Installed as /etc/helena/dnsmasq.d/helena.conf by heimnetz.sh dns-on.
# This instance is independent of libvirt's dnsmasq.
interface=eno1
except-interface=lo
listen-address=192.168.2.58
bind-interfaces
no-resolv
server=192.168.2.1
server=1.1.1.1
host-record=helena.volition.one,192.168.2.58
host-record=helena-home.volition.one,192.168.2.58
