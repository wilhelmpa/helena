# Installed by deployment/volition-stack/native/token-keeper/install.sh as
# volition-hermes-runner.service.d/helena-token-keeper.conf: the keeper renews what is due
# and writes the agents' login views before the runner starts its agents. Wants, not
# Requires: the runner starts even when the keeper could not reach a provider.
[Unit]
Wants=helena-token-keeper.service
After=helena-token-keeper.service
