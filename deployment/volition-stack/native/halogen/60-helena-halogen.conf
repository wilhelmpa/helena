# Kingston 128 GB serving baseline; validation limits and alternatives: kernel.md.
# Disables proactive compaction only, not direct compaction or all kcompactd work.
vm.compaction_proactiveness = 0
# Allocation reserve, not a guarantee of contiguous memory or a Halogen memory limit.
vm.min_free_kbytes = 1048576
# Relative swap/page-cache IO cost; does not lock weights or protect their file cache.
vm.swappiness = 10
