# Helena local AI: Halogen's tunables (native/halogen/install.sh copies this file to
# /etc/helena/halogen.conf once and never overwrites it; `install.sh status` names what differs
# from these defaults). A change takes effect with `systemctl restart helena-halogen` (minutes;
# check that no agent turn uses it first). Everything unset uses the vendor's default, which
# Halogen's GET /health lists (`server_defaults`).

# Conversations at a time and the KV pool they share (positions). 2 slots at the full 262k
# context: what ran on Kingston since 2026-09-28 (the vendor's default is 4).
HALOGEN_KV_SLOTS=2
HALOGEN_KV_POOL_POSITIONS=262144
# The most tokens one answer may ask for (the vendor caps at 65536).
HALOGEN_MAX_TOK=16384

# How much the model thinks when a request does not say. The vendor's default is `xhigh`;
# Helena's own calls say it themselves (reasoning_effort / chat_template_kwargs), agents' turns
# through Hermes only switch thinking on or off.
#HALOGEN_REASONING_EFFORT=medium
#HALOGEN_ENABLE_THINKING=1

# Sampling defaults for requests that sample (temperature > 0) and omit them.
#HALOGEN_TEMPERATURE=0.6
#HALOGEN_TOP_P=0.95
#HALOGEN_TOP_K=20
