name: volition-apps

services:
  workspace:
    hostname: volition-code
    build:
      context: ./workspace
    image: volition/code-workspace:4.138.0-node24.21.0-bun1.4.2-v5
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8091:8080"
      - "127.0.0.1:8100:8082"
    volumes:
      - workspace_home:/home/coder
      - type: bind
        source: ${CODE_SETTINGS_DIR:-/home/pw/services/volition-stack/.state/code-user-settings}
        target: /run/volition-code-settings
      - type: bind
        source: ${PROJECTS_ROOT:-/home/pw/services/volition-workspaces/projects}
        target: /projects
      - type: bind
        source: ${VERVE_PROJECT_PATH:-/home/pw/Projekte/Shopify/v1-cart-suite}
        target: /projects/verve
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,uid=1000,gid=1000
    mem_limit: 4g
    cpus: 3.0
    pids_limit: 1024
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null &&
          curl --fail --silent -H 'X-Forwarded-User: healthcheck@localhost'
          'http://127.0.0.1:8082/focus/terminal-project/?arg=default' >/dev/null
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      workspace:
        ipv4_address: 172.30.90.10

  nextcloud-db:
    image: volition/postgres:17-alpine-gosu-go1.26.6-20260921
    restart: unless-stopped
    user: postgres
    group_add:
      - "1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /run/postgresql:rw,nosuid,nodev,noexec,mode=3775,uid=70,gid=70
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD_FILE: /run/secrets/nextcloud_db_password
    secrets:
      - nextcloud_db_password
    volumes:
      - nextcloud_db:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "psql -U nextcloud -d nextcloud -Atqc 'SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      files-data:
        ipv4_address: 172.30.92.20

  nextcloud-redis:
    image: volition/redis:8.2-alpine-patched-20260921-v2
    restart: unless-stopped
    user: redis
    group_add:
      - "1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - nextcloud_redis:/data
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "set -e; test -s /run/secrets/redis_password; pass=$$(cat /run/secrets/redis_password); test -n \"$$pass\"; test \"$$(redis-cli --no-auth-warning -a \"$$pass\" --raw CONFIG GET requirepass | tail -n 1)\" = \"$$pass\"; test \"$$(redis-cli --no-auth-warning -a \"$$pass\" ping)\" = PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      files-data:
        ipv4_address: 172.30.92.21

  nextcloud:
    build:
      context: ./files
    image: volition/nextcloud:34.0.4-user-saml-8.3.1-hardened-20260922
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    tmpfs:
      - /run:rw,nosuid,nodev,noexec,mode=0755
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /var/lib/php/sessions:rw,nosuid,nodev,noexec,mode=1733
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8092:80"
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD_FILE: /run/secrets/nextcloud_db_password
      POSTGRES_HOST: nextcloud-db
      NEXTCLOUD_ADMIN_USER: volition-admin
      NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/nextcloud_admin_password
      NEXTCLOUD_DATA_DIR: /var/www/html/data
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.volition.one localhost 127.0.0.1
      REDIS_HOST: nextcloud-redis
      VOLITION_REDIS_SECRET_SOURCE: /run/secrets/redis_password
      REDIS_HOST_PASSWORD_FILE: /run/volition-secrets/redis_password
      TRUSTED_PROXIES: 127.0.0.1 172.30.93.1
      OVERWRITEHOST: cloud.volition.one
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://cloud.volition.one
      PHP_MEMORY_LIMIT: 768M
      PHP_UPLOAD_LIMIT: 2G
    secrets:
      - nextcloud_db_password
      - nextcloud_admin_password
      - redis_password
    volumes:
      - nextcloud_html:/var/www/html
      - nextcloud_data:/var/www/html/data
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "set -e; body=$$(curl --fail --silent http://127.0.0.1/status.php); printf '%s' \"$$body\" | grep -q '\"installed\":true'; printf '%s' \"$$body\" | grep -q '\"maintenance\":false'; test \"$$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1/remote.php/dav/files/)\" = 401"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 90s
    networks:
      files-front:
        ipv4_address: 172.30.93.22
      files-data:
        ipv4_address: 172.30.92.22

  nextcloud-init:
    image: volition/nextcloud:34.0.4-user-saml-8.3.1-hardened-20260922
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /run:rw,nosuid,nodev,noexec,mode=0755
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /var/lib/php/sessions:rw,nosuid,nodev,noexec,mode=1733
    entrypoint: ["/bin/sh", "/opt/volition/init-sso.sh"]
    depends_on:
      nextcloud:
        condition: service_healthy
    environment:
      REDIS_HOST: nextcloud-redis
      VOLITION_REDIS_SECRET_SOURCE: /run/secrets/redis_password
      REDIS_HOST_PASSWORD_FILE: /run/volition-secrets/redis_password
    secrets:
      - redis_password
    volumes:
      - nextcloud_html:/var/www/html
      - nextcloud_data:/var/www/html/data
      - ./files/init-sso.sh:/opt/volition/init-sso.sh:ro
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    networks:
      files-data:
        ipv4_address: 172.30.92.23

  nextcloud-cron:
    image: volition/nextcloud:34.0.4-user-saml-8.3.1-hardened-20260922
    restart: unless-stopped
    user: www-data
    group_add:
      - "1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        trap 'exit 0' TERM INT
        while true; do
          php -f /var/www/html/cron.php
          date +%s > /tmp/nextcloud-cron-last-success
          sleep 300 & wait $$!
        done
    depends_on:
      nextcloud:
        condition: service_healthy
    volumes:
      - nextcloud_html:/var/www/html
      - nextcloud_data:/var/www/html/data
    environment:
      REDIS_HOST: nextcloud-redis
      VOLITION_REDIS_SECRET_SOURCE: /run/secrets/redis_password
      REDIS_HOST_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - redis_password
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /var/lib/php/sessions:rw,nosuid,nodev,noexec,mode=1733
    healthcheck:
      test: ["CMD-SHELL", "set -e; test -s /tmp/nextcloud-cron-last-success; now=$$(date +%s); last=$$(cat /tmp/nextcloud-cron-last-success); test $$((now - last)) -lt 900; kill -0 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      files-data:
        ipv4_address: 172.30.92.24

secrets:
  nextcloud_db_password:
    file: ./.secrets/nextcloud_db_password
  nextcloud_admin_password:
    file: ./.secrets/nextcloud_admin_password
  redis_password:
    file: ./.secrets/redis_password

volumes:
  workspace_home:
  nextcloud_html:
  nextcloud_data:
  nextcloud_db:
    external: true
    name: volition-nextcloud-db-alpine-20260921-v2
  nextcloud_redis:
    external: true
    name: volition-nextcloud-redis-alpine-20260921-v2

networks:
  workspace:
    name: volition-workspace
    ipam:
      config:
        - subnet: 172.30.90.0/24
          gateway: 172.30.90.1
  files-front:
    name: volition-files-front
    ipam:
      config:
        - subnet: 172.30.93.0/24
          gateway: 172.30.93.1
  files-data:
    name: volition-files-data
    internal: true
    ipam:
      config:
        - subnet: 172.30.92.0/24
          gateway: 172.30.92.1
