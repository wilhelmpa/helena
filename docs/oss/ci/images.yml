# Draft placeholder (package G): the image build of the Docker phase ("Docker machen wir als
# Letztes"). Filled in once the Dockerfile exists; the shape is fixed here so the release
# process is complete on paper.
#
#   on tag vX.Y.Z → build helena and helena-agents for linux/amd64 and linux/arm64 with
#   BuildKit SBOM + provenance attestations → push to ghcr.io/<org>/helena{,-agents} with the
#   tags X.Y.Z, X.Y, X, latest → sign with cosign (keyless, GitHub OIDC) → attach the SBOM
#   (anchore/sbom-action, SPDX) to the GitHub release.
name: Images

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: false # enabled in the Docker phase
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image: [helena, helena-agents]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/helena/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
